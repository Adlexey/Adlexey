name: Update Work Experience
on:
  schedule:
    - cron: '0 0 * * *' # Обновлять каждый день
  workflow_dispatch: # Ручной запуск

jobs:
  update-experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Update experience SVG
        run: |
          curl -s "https://api.svgbox.in/api/experience?start_date=2024-08-20&format=svg" > profile/experience.svg
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile/experience.svg
          git commit -m "Update work experience" || exit 0
          git push
